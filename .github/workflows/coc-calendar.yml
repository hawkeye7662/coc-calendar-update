name: Update CoC Calendar

on:
  workflow_dispatch:
  push:
    paths:
      - 'coc_state.json'

permissions:
  id-token: write
  contents: read

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/787553983892/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'coc-calendar-bot@clash-of-clans-timers.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client pytz

      - name: Run script
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: python coc_to_calendar.py
